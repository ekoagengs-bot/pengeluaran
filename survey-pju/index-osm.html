<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey PJU • Peta Gratis</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#152235}header{background:linear-gradient(135deg,#0b3b60,#1565c0);color:#fff;padding:18px}main{max-width:1600px;margin:auto;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar select,.toolbar input,.toolbar button{padding:10px;border:1px solid #dfe6ee;border-radius:10px;background:#fff;font:inherit}.primary{background:#1565c0!important;color:#fff!important}.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid #dfe6ee;border-radius:14px;padding:14px;box-shadow:0 5px 18px #0b3b6010}.label{font-size:12px;color:#6b7785}.value{font-size:28px;font-weight:800;margin-top:7px}.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.map{height:650px;border-radius:11px;overflow:hidden}.tablewrap{max-height:650px;overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px;border-bottom:1px solid #dfe6ee;text-align:left;vertical-align:top}.table th{position:sticky;top:0;background:#f8fafc}.pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800}.good{background:#e8f5e9;color:#2e7d32}.bad{background:#ffebee;color:#c62828}.note{font-size:12px;color:#6b7785;margin-top:8px}@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:650px){main{padding:10px}.kpis{grid-template-columns:repeat(2,1fr)}.map{height:460px}.value{font-size:24px}}</style></head><body><header><b>🚦 SURVEY PJU — BIMA • DOMPU • KOTA BIMA</b><div style="font-size:12px;margin-top:5px">Peta gratis Leaflet + OpenStreetMap | ULP Sape • Dompu • Woha • Bikot</div></header><main><div class="toolbar"><select id="ulp"><option value="">Semua ULP</option><option>ULP Sape</option><option>ULP Dompu</option><option>ULP Woha</option><option>ULP Bikot</option></select><select id="wilayah"><option value="">Semua Wilayah</option><option>Kabupaten Bima</option><option>Kabupaten Dompu</option><option>Kota Bima</option></select><select id="legalitas"><option value="">Semua Legalitas</option><option>LEGAL</option><option>ILEGAL</option></select><select id="kondisi"><option value="">Semua Kondisi</option><option>Baik</option><option>Rusak Ringan</option><option>Rusak Berat</option><option>Hilang</option><option>Perlu Pemeriksaan</option></select><input id="q" placeholder="Cari ID / IDPEL / lokasi / tiang…"><button class="primary" id="refresh">↻ Refresh</button><button id="csv">⇩ CSV</button></div><div class="kpis" id="kpis"></div><div class="layout"><section class="panel"><h3>📍 Peta Lokasi Survey PJU</h3><div id="map" class="map"></div><div class="note">Merah = ILEGAL. Marker berwarna = ULP. Klik marker untuk melihat detail.</div></section><section class="panel"><h3>🧾 Data Survey</h3><div class="tablewrap"><table class="table"><thead><tr><th>ID / IDPEL</th><th>ULP</th><th>Lokasi</th><th>Legalitas</th><th>Kondisi</th></tr></thead><tbody id="tbody"><tr><td colspan="5">Memuat…</td></tr></tbody></table></div></section></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const CFG={id:'1IhB-agDYb7WcVSnZioHRWYE9Hm2iQLsJdA72E9jlXWY',sheet:'PJU_Survey'};let H=[],R=[],M;const C={'ULP Sape':'#1565c0','ULP Dompu':'#6a1b9a','ULP Woha':'#2e7d32','ULP Bikot':'#ef6c00'};const A={id:['ID Survey','ID','ID_PJU'],idpel:['IDPEL','Idpel'],ulp:['ULP'],wilayah:['Wilayah','Kabupaten/Kota','Kabupaten_Kota'],legal:['Status Legalitas','Legalitas','Status_Legalitas'],kondisi:['Kondisi','Kondisi PJU','Kondisi Tiang'],lat:['Latitude','Lat','LAT'],lon:['Longitude','Long','Lng','LON'],desa:['Desa','Desa/Kelurahan','Desa_Kelurahan'],kec:['Kecamatan'],alamat:['Alamat'],tiang:['Nomor Tiang','Nomor_Tiang','No_Tiang'],tanggal:['Tanggal','Timestamp']};function n(s){return String(s??'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'_')}function idx(k){for(const x of(A[k]||[])){const i=H.findIndex(h=>n(h)===n(x));if(i>=0)return i}return-1}function v(r,k){const i=idx(k);return i<0?'':r[i]??''}function e(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function json(t){let a=t.indexOf('{'),b=t.lastIndexOf('}');return JSON.parse(t.slice(a,b+1))}async function load(){document.getElementById('refresh').disabled=true;try{let u=`https://docs.google.com/spreadsheets/d/${CFG.id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CFG.sheet)}&tq=${encodeURIComponent('select *')}`,r=await fetch(u);if(!r.ok)throw Error('Google Sheet tidak bisa dibaca');let d=json(await r.text());H=d.table.cols.map(x=>x.label||'');R=d.table.rows.map(x=>x.c.map(c=>c?.v??''));render()}catch(x){document.getElementById('tbody').innerHTML=`<tr><td colspan="5">${e(x.message)}</td></tr>`}finally{document.getElementById('refresh').disabled=false}}function filtered(){let u=ulp.value,w=wilayah.value,l=legalitas.value,k=kondisi.value,q=document.getElementById('q').value.toLowerCase().trim();return R.filter(r=>(!u||v(r,'ulp')===u)&&(!w||v(r,'wilayah')===w)&&(!l||String(v(r,'legal')).toUpperCase()===l)&&(!k||v(r,'kondisi')===k)&&(!q||[v(r,'id'),v(r,'idpel'),v(r,'desa'),v(r,'kec'),v(r,'alamat'),v(r,'tiang')].join(' ').toLowerCase().includes(q)))}function render(){let rs=filtered(),bad=rs.filter(r=>['Rusak Ringan','Rusak Berat','Hilang','Perlu Pemeriksaan'].includes(v(r,'kondisi'))).length,le=rs.filter(r=>String(v(r,'legal')).toUpperCase()==='LEGAL').length,il=rs.filter(r=>String(v(r,'legal')).toUpperCase()==='ILEGAL').length,noid=rs.filter(r=>String(v(r,'legal')).toUpperCase()==='LEGAL'&&!String(v(r,'idpel')).trim()).length,cs=[['Total PJU',rs.length],['LEGAL',le],['ILEGAL',il],['Legal Tanpa IDPEL',noid],['ULP Sape',rs.filter(r=>v(r,'ulp')==='ULP Sape').length],['ULP Dompu',rs.filter(r=>v(r,'ulp')==='ULP Dompu').length],['ULP Woha',rs.filter(r=>v(r,'ulp')==='ULP Woha').length],['Perlu Penanganan',bad]];kpis.innerHTML=cs.map(c=>`<div class="card"><div class="label">${c[0]}</div><div class="value">${c[1].toLocaleString('id-ID')}</div></div>`).join('');tbody.innerHTML=rs.slice().reverse().slice(0,300).map(r=>`<tr><td><b>${e(v(r,'id'))}</b><br><small>IDPEL: ${e(v(r,'idpel'))||'-'}<br>${e(v(r,'tanggal'))}</small></td><td>${e(v(r,'ulp'))}</td><td>${e([v(r,'desa'),v(r,'kec')].filter(Boolean).join(', '))}<br><small>${e(v(r,'alamat'))}</small></td><td><span class="pill ${String(v(r,'legal')).toUpperCase()==='LEGAL'?'good':'bad'}">${e(v(r,'legal'))||'-'}</span></td><td>${e(v(r,'kondisi'))||'-'}</td></tr>`).join('')||'<tr><td colspan="5">Tidak ada data.</td></tr>';plot(rs)}function plot(rs){M.clearLayers();let b=[];rs.forEach(r=>{let lat=parseFloat(v(r,'lat')),lon=parseFloat(v(r,'lon'));if(!Number.isFinite(lat)||!Number.isFinite(lon))return;let ul=v(r,'ulp'),legal=String(v(r,'legal')).toUpperCase(),m=L.circleMarker([lat,lon],{radius:7,weight:2,color:'#fff',fillColor:legal==='ILEGAL'?'#c62828':(C[ul]||'#607d8b'),fillOpacity:.9});m.bindPopup(`<b>${e(v(r,'id'))}</b><br>IDPEL: ${e(v(r,'idpel'))||'-'}<br>ULP: ${e(ul)}<br>Legalitas: <b>${e(v(r,'legal'))}</b><br>${e(v(r,'desa'))}, ${e(v(r,'kec'))}<br>Kondisi: <b>${e(v(r,'kondisi'))}</b><br>${e(v(r,'alamat'))}`);M.addLayer(m);b.push([lat,lon])});if(b.length)map.fitBounds(b,{padding:[20,20],maxZoom:14})}function download(){let rs=filtered();let csv=[H,...rs].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='survey_pju_filtered.csv';a.click()}const map=L.map('map').setView([-8.55,118.62],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);M=L.layerGroup().addTo(map);refresh.onclick=load;csv.onclick=download;['ulp','wilayah','legalitas','kondisi'].forEach(id=>document.getElementById(id).onchange=render);document.getElementById('q').oninput=render;load();</script></body></html>
