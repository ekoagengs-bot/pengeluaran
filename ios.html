<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MoniKas">
<meta name="description" content="MoniKas — pemantauan pengeluaran untuk iPhone dan iPad">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>MoniKas untuk iOS</title>
<style>
:root{color-scheme:light;--bg:#f3f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#2563eb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;color:var(--text)}
main{min-height:100svh;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));display:grid;place-items:center}.card{width:min(420px,100%);background:var(--card);border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(15,23,42,.10);text-align:center}.logo{width:72px;height:72px;margin:0 auto 16px;border-radius:22px;background:#0f172a;color:#fff;display:grid;place-items:center;font-size:32px;font-weight:900}.title{font-size:30px;font-weight:900;letter-spacing:-.03em}.muted{color:var(--muted);line-height:1.5}.btn{display:block;width:100%;margin-top:18px;padding:14px 16px;border:0;border-radius:15px;background:var(--primary);color:#fff;font-weight:800;font-size:16px;text-decoration:none}.hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.55}
</style>
</head>
<body>
<main>
 <section class="card">
  <div class="logo">M</div>
  <div class="title">MoniKas</div>
  <p class="muted">Versi iOS untuk iPhone dan iPad.<br>Memuat aplikasi…</p>
  <a class="btn" href="./">Buka MoniKas</a>
  <div class="hint">Untuk memasang seperti aplikasi: buka halaman ini di Safari → Bagikan → Tambahkan ke Layar Utama.</div>
 </section>
</main>
<script>
setTimeout(()=>{location.replace('./')},600);
</script>
</body>
</html>
