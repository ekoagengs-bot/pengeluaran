name: Install Gold Native UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Gold Native script into index.html
        shell: bash
        run: |
          set -e
          if grep -q 'gold-native-v5.js' index.html; then
            echo 'Gold Native script already installed.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="./gold-native-v5.js?v=5"></script>'
          if '</body>' not in s:
              raise SystemExit('Tidak ditemukan tag </body> pada index.html')
          s = s.replace('</body>', marker + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit index.html
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Tidak ada perubahan.'
            exit 0
          fi
          git commit -m 'MoniKas: install native gram input [skip ci]'
          git push
