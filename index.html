<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.json"><title>MoniKas - Pemantauan Pengeluaran</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6fb;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}.wrap{max-width:1100px;margin:auto}.brand{font-size:22px;font-weight:800}.sub{font-size:13px;opacity:.7;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.label{font-size:12px;color:#64748b}.value{font-size:25px;font-weight:800;margin-top:7px}.green{color:#16a34a}.red{color:#dc2626}.blue{color:#2563eb}.section{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form{display:grid;gap:10px}input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #cbd5e1;font:inherit}button{background:#2563eb;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#e2e8f0;color:#0f172a}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{margin-top:12px}.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e2e8f0}.item:last-child{border-bottom:0}.title{font-weight:700}.meta{font-size:12px;color:#64748b;margin-top:3px}.empty{text-align:center;color:#64748b;padding:20px}@media(max-width:760px){.grid,.section{grid-template-columns:1fr}.row{grid-template-columns:1fr}main{padding:0 12px}}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:12px;background:#dbeafe;color:#1d4ed8;padding:7px 10px;border-radius:999px;font-weight:700}.budget{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.budget>i{display:block;height:100%;background:#2563eb}.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar>*{flex:1}</style></head><body><header><div class="wrap"><div class="brand">MoniKas</div><div class="sub">Pemantauan pengeluaran pribadi & rumah tangga</div></div></header><main class="wrap"><div class="toolbar"><input id="month" type="month"><button class="secondary" onclick="clearData()">Reset Data</button></div><section class="grid"><div class="card"><div class="label">Pendapatan</div><div class="value green" id="income">Rp0</div></div><div class="card"><div class="label">Pengeluaran</div><div class="value red" id="expense">Rp0</div></div><div class="card"><div class="label">Saldo</div><div class="value blue" id="balance">Rp0</div></div></section><section class="section"><div class="card"><div class="topline"><h3>Tambah Transaksi</h3><span class="pill">Offline</span></div><div class="form"><select id="type"><option value="expense">Pengeluaran</option><option value="income">Pendapatan</option></select><input id="date" type="date"><input id="desc" placeholder="Keterangan"><select id="category"><option>Makanan</option><option>Transportasi</option><option>Belanja</option><option>Tagihan</option><option>Pendidikan</option><option>Kesehatan</option><option>Hiburan</option><option>Lainnya</option></select><input id="amount" type="number" min="0" placeholder="Nominal (Rp)"><button onclick="addTx()">Simpan Transaksi</button></div></div><div class="card"><div class="topline"><h3>Anggaran Kategori</h3><span class="pill" id="ratio">0%</span></div><div id="budgets"></div></div></section><div class="card" style="margin:14px 0"><div class="topline"><h3>Transaksi Bulan Ini</h3><button style="width:auto;padding:9px 12px" onclick="exportData()">Ekspor JSON</button></div><div id="list" class="list"></div></div></main><script>const KEY='monikas_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"transactions":[],"budgets":{"Makanan":1500000,"Transportasi":800000,"Belanja":1000000,"Tagihan":1500000,"Pendidikan":500000,"Kesehatan":500000,"Hiburan":400000,"Lainnya":500000}}');const $=id=>document.getElementById(id);const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function selectedMonth(){return $('month').value||new Date().toISOString().slice(0,7)}function addTx(){const t={id:Date.now(),type:$('type').value,date:$('date').value||new Date().toISOString().slice(0,10),desc:$('desc').value.trim(),category:$('category').value,amount:Number($('amount').value)};if(!t.desc||!t.amount)return alert('Lengkapi keterangan dan nominal.');data.transactions.push(t);$('desc').value='';$('amount').value='';save()}function render(){const m=selectedMonth(),tx=data.transactions.filter(x=>x.date.slice(0,7)===m),inc=tx.filter(x=>x.type==='income').reduce((a,b)=>a+b.amount,0),exp=tx.filter(x=>x.type==='expense').reduce((a,b)=>a+b.amount,0);$('income').textContent=rupiah(inc);$('expense').textContent=rupiah(exp);$('balance').textContent=rupiah(inc-exp);$('ratio').textContent=inc?Math.round(exp/inc*100)+'%':'0%';$('list').innerHTML=tx.length?tx.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="item"><div><div class="title">${esc(x.desc)}</div><div class="meta">${x.date} • ${esc(x.category)}</div></div><div style="font-weight:800" class="${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'-'} ${rupiah(x.amount)}</div></div>`).join(''):'<div class="empty">Belum ada transaksi pada bulan ini.</div>';const sums={};tx.filter(x=>x.type==='expense').forEach(x=>sums[x.category]=(sums[x.category]||0)+x.amount);$('budgets').innerHTML=Object.entries(data.budgets).map(([c,b])=>{const v=sums[c]||0,p=Math.min(100,b?Math.round(v/b*100):0);return `<div style="margin:12px 0"><div class="topline"><span>${c}</span><small>${rupiah(v)} / ${rupiah(b)}</small></div><div class="budget"><i style="width:${p}%"></i></div></div>`}).join('')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='monikas-data.json';a.click();URL.revokeObjectURL(a.href)}function clearData(){if(confirm('Hapus seluruh transaksi?')){data.transactions=[];save()}}$('month').value=new Date().toISOString().slice(0,7);$('month').addEventListener('change',render);render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
